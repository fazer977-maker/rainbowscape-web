name: Build web client
on:
  push:
    paths-ignore: ['site/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: unzip -q *.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: rsps-android/web/pom.xml
      - name: Assemble sources
        run: python3 rsps-android/web/prepare.py
      - name: Compile to JavaScript (TeaVM)
        run: mvn -B -f rsps-android/web/pom.xml process-classes
      - name: Build the site folder
        run: |
          mkdir -p site/play
          cp -n rsps-android/site/index.html rsps-android/site/rainbowscape.apk site/ || true
          cp -n rsps-android/site/play/config.js site/play/ || true
          cp rsps-android/web/target/js/rainbow.js site/play/
          cp rsps-android/web/static/index.html site/play/
      - name: Commit the site (Netlify publishes the site/ folder)
        run: |
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add site
          git diff --cached --quiet || (git commit -m "Update built web client" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: rainbowscape-site
          path: site/
