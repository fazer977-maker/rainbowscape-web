      - uses: actions/upload-artifact@v4
        with:
          name: rainbowscape-site
          path: site/
      - name: Commit the site
        continue-on-error: true
        run: |
          git config user.name "build"
          git config user.email "build@users.noreply.github.com"
          git add site
          git diff --cached --quiet || git commit -m "Update built web client"
          git pull --rebase -X theirs origin main || true
          git push || true
