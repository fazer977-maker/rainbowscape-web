<title>Rainbow Scape</title>
<style>

            gap: 14px; color: #fff; font: 600 15px/1.4 system-ui, sans-serif; text-align: center; padding: 24px; z-index: 5; }

          width: 44px; height: 44px; border-radius: 12px; border: 2px solid #ffffff55; background: #0a0714bb; color: #fff; font-size: 20px; display: none; }
  #fsbtn { position: fixed; left: calc(max(10px, env(safe-area-inset-left)) + 54px); bottom: max(10px, env(safe-area-inset-bottom)); z-index: 4; opacity: .55;
          width: 44px; height: 44px; border-radius: 12px; border: 2px solid #ffffff55; background: #0a0714bb; color: #fff; font-size: 22px; display: block; }

<script>
/* debug: put the JS stack inside error names so the on-screen log shows where an error came from */
(function(){
  var busy=false;
  function snip(e){
    if(busy)return '';busy=true;
    try{var st=String(e.stack||'').split('\n').slice(1,9).map(function(l){return l.trim().replace(/^at /,'').replace(/https?:\/\/[^ )]*\//g,'')}).join(' < ');return st?' ['+st+']':''}
    catch(x){return ''}finally{busy=false}
  }
  ['TypeError','RangeError','ReferenceError'].forEach(function(n){
    try{Object.defineProperty(window[n].prototype,'name',{configurable:true,get:function(){return n+snip(this)}})}catch(e){}
  });
})();
</script>
<div id="dbg" style="position:fixed;left:0;top:0;max-width:100%;max-height:48vh;overflow:hidden;background:rgba(0,0,0,.72);color:#9f9;font:11px/1.3 monospace;padding:4px 6px;z-index:50;pointer-events:none;white-space:pre-wrap;word-break:break-all"></div>

      ks.forEach(function (k) { ps.put(P[k], k); }); mk.forEach(function (k) { ms.put(M[k], k); });
      tx.onerror = tx.onabort = function () { console.log("cache save failed"); };
    } catch (e) { console.log("cache save error " + e); }
  }
  document.addEventListener("visibilitychange", function () { if (document.hidden) flush(); });
  window.addEventListener("pagehide", flush);
  function openCache(done) {
    var finished = false; function fin() { if (!finished) { finished = true; done(); } }
    try {
      if (/[?&]resetcache/.test(location.search)) { indexedDB.deleteDatabase("rs-cache-v1"); console.log("saved cache cleared"); }
      var r = indexedDB.open("rs-cache-v1", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("pages"); r.result.createObjectStore("meta"); };
      r.onerror = r.onblocked = function () { console.log("saved cache unavailable"); fin(); };
      r.onsuccess = function () {
        DB = r.result; var n = 0;
        try {
          var tx = DB.transaction(["pages", "meta"], "readonly");
          var c1 = tx.objectStore("pages").openCursor();
          c1.onsuccess = function () { var c = c1.result; if (c) { PG[c.key] = c.value instanceof Uint8Array ? c.value : new Uint8Array(c.value); n++; c.continue(); } };
          var c2 = tx.objectStore("meta").openCursor();
          c2.onsuccess = function () { var c = c2.result; if (c) { MT[c.key] = c.value; c.continue(); } };
          tx.oncomplete = function () { console.log("saved cache: " + n + " pages"); fin(); };
          tx.onerror = tx.onabort = function () { console.log("saved cache read failed"); fin(); };
        } catch (e) { console.log("saved cache error " + e); fin(); }
      };
      setTimeout(fin, 8000);
    } catch (e) { console.log("saved cache off: " + e); fin(); }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  }


  /* ---- sound: queue the game's PCM in a ring and play it with Web Audio ----------------------- */
  var AU = [], RING = 1 << 20, MASK = RING - 1;
  window.__auUnlock = function () { AU.forEach(function (a) { if (a && a.ctx && a.ctx.state !== "running") { try { a.ctx.resume(); } catch (e) {} } }); };
  ["pointerdown", "touchend", "click", "keydown"].forEach(function (ev) { document.addEventListener(ev, window.__auUnlock, { passive: true }); });
  function audioOpen(rate, ch) {
    var a = { rate: rate, ch: ch, ring: new Uint8Array(RING), rd: 0, wr: 0, last: Date.now(), ctx: null, node: null, pos: 0, play: false };
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      try { a.ctx = new AC({ sampleRate: rate }); } catch (e) { a.ctx = new AC(); }
      var step = rate / a.ctx.sampleRate, bps = 2 * ch;
      a.node = a.ctx.createScriptProcessor(4096, 0, 2);
      a.node.onaudioprocess = function (e) {
        var L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1), n = L.length, ring = a.ring, pos = a.pos;
        for (var i = 0; i < n; i++) {
          if (!a.play) { if (a.wr - a.rd >= Math.min(rate * bps * 0.12, 4096)) a.play = true; else { L[i] = 0; R[i] = 0; continue; } }
          if (a.wr - a.rd < bps) { a.play = false; L[i] = 0; R[i] = 0; continue; }
          var p = a.rd & MASK, l = (ring[p] | (ring[(p + 1) & MASK] << 8)) << 16 >> 16, r = l;
          if (ch > 1) r = (ring[(p + 2) & MASK] | (ring[(p + 3) & MASK] << 8)) << 16 >> 16;
          L[i] = l / 32768; R[i] = r / 32768;
          pos += step;
          var adv = Math.floor(pos);
          if (adv > 0) { a.rd = Math.min(a.wr, a.rd + adv * bps); pos -= adv; }
        }
        a.pos = pos;
      };
      a.node.connect(a.ctx.destination);
      if (a.ctx.state !== "running") a.ctx.resume().catch(function () {});
    } catch (e) { console.log("audio unavailable: " + e); a.ctx = null; }
    for (var i = 0; i < AU.length; i++) if (!AU[i]) { AU[i] = a; return i; }
    AU.push(a); return AU.length - 1;
  }
  function audioWrite(id, s) {
    var a = AU[id]; if (!a) return;
    if (a.wr - a.rd + s.length > RING) return;
    for (var i = 0; i < s.length; i++) a.ring[(a.wr + i) & MASK] = s.charCodeAt(i);
    a.wr += s.length;
  }
  function audioFill(id) {
    var a = AU[id]; if (!a) return 0;
    var now = Date.now();
    if (!a.ctx || a.ctx.state !== "running") {          // not unlocked yet: keep draining at real speed so the game keeps mixing
      a.rd = Math.min(a.wr, a.rd + Math.floor((now - a.last) * a.rate * a.ch * 2 / 1000));
    }
    a.last = now;
    return a.wr - a.rd;
  }
  function audioFlush(id) { var a = AU[id]; if (a) { a.rd = a.wr; a.pos = 0; } }
  function audioClose(id) { var a = AU[id]; if (a) { try { a.node.disconnect(); a.ctx.close(); } catch (e) {} AU[id] = null; } }

  window.rs = {
    audioOpen: audioOpen, audioWrite: audioWrite, audioFill: audioFill, audioFlush: audioFlush, audioClose: audioClose,
    cfg: function (k) { return C[k]; },
    cacheLen: function (f) { return (f in MT) ? MT[f] : -1; },
    cacheHas: function (f, p) { return PG[ck(f, p)] ? 1 : 0; },
    cacheGet4: function (f, p, i) { var t = PG[ck(f, p)]; if (!t) return 0; return (t[i] | 0) | ((t[i + 1] | 0) << 8) | ((t[i + 2] | 0) << 16) | ((t[i + 3] | 0) << 24); },
    cacheGetStr: function (f, p) { var t = PG[ck(f, p)]; return t ? latin1(t, t.length) : ""; },
    cacheDrop: function (f, p) { delete PG[ck(f, p)]; },
    cachePut: function (f, p, a, n) { var u = new Uint8Array(a.buffer, a.byteOffset, n).slice(); pend[ck(f, p)] = u; if (f.indexOf("main_file_cache") !== 0) PG[ck(f, p)] = u; sched(); },
    cacheMeta: function (f, n) { MT[f] = n; pendMeta[f] = n; sched(); },
    wsOpen: function (u) { return new Conn(u); },
    present: present, viewW: viewW, viewH: viewH,
    textMetrics: textMetrics, metric: metric, textWidth: textWidth, glyphs: glyphs, glyphAt: glyphAt,
    inHas: function () { if (qi >= q.length) { q.length = 0; qi = 0; return false; } return true; },
    inNext: function () { return q[qi++]; },
    log: function (t) { console.log("[rs]", t); if (/crash|error|failed/i.test(t) && first) say(String(t).slice(0, 160), true); }
  };

  /* ---- start ---------------------------------------------------------------------------- */
  say("Loading saved data…");
  openCache(startGame);
  function startGame() {
  var s = document.createElement("script");
  s.src = "rainbow.js";
  s.onload = function () { say("Starting client…"); console.log("rainbow.js loaded, calling main"); try { main([]); } catch (e) { say("Could not start: " + e, true); console.error(e); } };
  s.onerror = function () { say("Could not load rainbow.js", true); };
  document.body.appendChild(s);
  }
  /* ---- UI size button: bigger number = smaller interface (sharper, a bit slower) ------------ */
  (function () {
    var b = document.getElementById("szbtn");
    b.textContent = "UI " + (gameW / 100 | 0);
    b.addEventListener("click", function (e) {
      e.preventDefault();
      var i = SIZES.indexOf(gameW); gameW = SIZES[(i + 1) % SIZES.length];
      try { localStorage.setItem("rs-w", String(gameW)); } catch (x) {}
      location.reload();
    });
  })();
  var inGame = false;
  window.rs.gameState = function (st) { inGame = (st === 30 || st === 25 || st === 28); };
  /* in the game world a tap on the screen hides the on-screen keyboard (use the keyboard button for chat) */
  canvas.addEventListener("touchend", function () {
    if (inGame && document.activeElement === kb) kb.blur();
  }, { passive: true });

})();

  window.rs.soundOff = function () { return 0; };   /* music is always on */

  /* ---- full screen button ---------------------------------------------------------------- */
  (function () {
    var b = document.getElementById("fsbtn"), d = document;
    b.addEventListener("click", function (e) {
      e.preventDefault();
      try {
        if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); return; }
        var el = d.documentElement, p = (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        var lock = function () { try { screen.orientation.lock("landscape").catch(function () {}); } catch (x) {} };
        if (p && p.then) p.then(lock, function () {}); else lock();
      } catch (x) { console.log("fullscreen failed: " + x); }
    });
  })();

</script>
